# Feature Index
# Master lookup: every feature mapped to all related artifacts across the repo.
# Organized by product area -> feature -> artifact paths (relative to product-development/).
#
# When looking up a specific feature, search this file first.
# Skills create entries here as artifacts are generated.

# Example entry (uncomment and customize when adding your first feature):
#
# session-trace-comparison:
#   prd: product/PRDs/session-trace-comparison/prd.md
#   spec: product/specs/session-trace-comparison-spec.md
#   user-stories: product/user-stories/session-trace-comparison-stories.md
#   eng-rfc: engineering/rfcs/session-trace-comparison-rfc.md
#   eng-plan: engineering/plans/session-trace-comparison.md
#   metrics: analytics/metrics/session-trace-comparison-metrics.md
#   queries:
#     - analytics/queries/trace-comparison-usage.sql
#   dashboards: analytics/dashboards/session-trace-comparison.md
#   tickets:
#     - W-XXXXX
#   figma: https://figma.com/file/...
#   bug-investigations:
#     - engineering/bug-investigations/...
